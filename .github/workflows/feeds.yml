name: Generate RSS

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Generate feed
        run: |
          mkdir -p feeds
          uv run --locked --no-dev raiplaysound \
            single https://www.raiplaysound.it/programmi/radio3scienza \
            --dateok --skip playlist --folder feeds
          test -s feeds/radio3scienza.xml
          chmod 644 feeds/*

      - name: Upload feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: "feeds/"

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
